spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:expense_tracker}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  jackson:
    time-zone: UTC
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  # Use Tomcat's native RemoteIpValve so X-Forwarded-For is only trusted when
  # the request arrives from a private-network address (Caddy on the same Docker
  # network). Requests from public IPs are never trusted for XFF, preventing
  # attackers from spoofing their IP to bypass the login rate limiter.
  forward-headers-strategy: NATIVE
  tomcat:
    remoteip:
      trusted-proxies: 10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|192\.168\.\d+\.\d+|127\.0\.0\.1

app:
  jwt:
    secret: ${SECRET_KEY}
    expiry-days: 30
  encryption:
    # Dedicated key for encrypting stored Gmail refresh tokens / user AI API keys.
    # Falls back to SECRET_KEY so existing deployments keep working, but a leaked
    # JWT secret would then also decrypt those columns — set ENCRYPTION_KEY separately.
    secret: ${ENCRYPTION_KEY:${SECRET_KEY}}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:/app/data/uploads}
  allow-registration: ${ALLOW_REGISTRATION:false}
  app-url: ${APP_URL:http://localhost:3000}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:noreply@expensetracker.app}
  gmail:
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    redirect-uri: ${GMAIL_REDIRECT_URI:http://localhost:8080/api/v1/gmail/callback}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-solo: ${STRIPE_PRICE_SOLO:}
    price-pro: ${STRIPE_PRICE_PRO:}
    price-business: ${STRIPE_PRICE_BUSINESS:}
    price-overage: ${STRIPE_PRICE_OVERAGE:}
  ai:
    groq-api-key: ${GROQ_API_KEY:}
    openrouter-api-key: ${OPENROUTER_API_KEY:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    max-retries: 2
    anthropic-ocr-model: ${ANTHROPIC_OCR_MODEL:claude-sonnet-4-6}
    groq-ocr-model: ${GROQ_OCR_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}
    openrouter-ocr-model: ${OPENROUTER_OCR_MODEL:google/gemini-2.5-flash-preview-05-20}
    anthropic-chat-model: ${ANTHROPIC_CHAT_MODEL:claude-haiku-4-5-20251001}
    groq-chat-model: ${GROQ_CHAT_MODEL:llama-3.3-70b-versatile}
    ocr-provider: ${OCR_PROVIDER:auto}

logging:
  level:
    com.expensetracker: INFO
    org.springframework.security: WARN
